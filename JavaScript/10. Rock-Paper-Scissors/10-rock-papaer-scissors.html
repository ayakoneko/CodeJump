<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles/10-rock-papaer-scissors.css">

</head>
<body>
    <p class="title">Rock Paper Scissors</p>
    <p>
        <button onclick="playGame('rock');" class="move-button"><img src="img/rock-emoji.png" class="move-icon"></button>
        <button onclick="playGame('paper');"class="move-button"><img src="img/paper-emoji.png" class="move-icon"></button>
        <button onclick="playGame('scissors');" class="move-button"><img src="img/scissors-emoji.png" class="move-icon"></button>
    </p>

    <p class="js-result result"></p>
    <p class="js-move"></p> 
    <p class="js-score score"></p>
    
    <button class="reset-button" onclick="
            score.wins = 0;
            score.losses = 0;
            score.ties = 0;
            localStorage.removeItem('score');
            updateScoreElement();
        ">Reset Score</button>
    

    <script src="scripts/10-rock-papaer-scissors.js"></script>
</body>
</html>
