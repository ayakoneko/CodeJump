<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <p>
        <button onclick = "
            calculation += '1';
            console.log(calculation);
        ">1</button>

        <button onclick="
            calculation += '2';
            console.log(calculation);
        ">2</button>

        <button onclick="
            calculation += '3';
            console.log(calculation);
        ">3</button>
    </p>

    <p>    
        <button onclick="
            calculation += '+';
            console.log(calculation);
        ">+</button>
    
        <button onclick="
            calculation += ' - ';
            console.log(calculation);
        ">-</button>
            
        <button onclick="
            calculation += ' * ';
            console.log(calculation);
        ">*</button>

        <button onclick="
            calculation += ' / ';
            console.log(calculation);
        ">/</button>
    </p>
    <p>     
        <button onclick="
            calculation =eval(calculation);
            console.log(calculation);
        ">=</button>
    
        <button onclick="
            calculation = '';
            console.log('Reset');
        ">Reset</button>
    </p>
    
    <script>
        let calculation = '';     
    </script>
    
</body>
</html>
