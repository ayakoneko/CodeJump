<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles/10-rock-papaer-scissors.css">

</head>
<body>
    <p class="title">Rock Paper Scissors</p>
    <p>
        <button class="move-button js-rock-button"><img src="img/rock-emoji.png" class="move-icon"></button>
        <button class="move-button js-paper-button"><img src="img/paper-emoji.png" class="move-icon"></button>
        <button class="move-button js-scissors-button"><img src="img/scissors-emoji.png" class="move-icon"></button>
    </p>

    <p class="js-result result"></p>
    <p class="js-move"></p> 
    <p class="js-score score"></p>
    
    <button class="reset-button js-reset-button">Reset Score</button>
    <button class="autoPlay-button js-autoPlay-button">Auto Play</button>
    
    <p class="js-reset-confirmation"></p>

    <script src="scripts/10-rock-papaer-scissors.js"></script>
</body>
</html>
