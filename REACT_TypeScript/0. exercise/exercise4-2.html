<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
    <style>
      body{
        font-family: Arial, Helvetica, sans-serif;
      }
      .title{
        font-size: 25px;
      }

      .input{
        padding: 10px 15px;
        margin-bottom: 10px;
        border-radius: 5px;
        border-width: 1px;
        width: 200px;


      }
      .button{
        background-color: rgb(0, 123, 255);
        color: white;
        padding: 10px 15px;
        margin-top: 10px;
        margin-right: 5px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      .show-button{
        margin-left: 10px;
      }
    </style>

  </head>
  
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      
        function LoginForm() {
          const [showPassword, setShowPassword] = React.useState(false);

          function toggleShowPassword() {
            setShowPassword(!showPassword);
          }

          return (
            <>
              <div>
                <input className="input" placeholder="Email"/>
              </div>
              <div>
                <input className="input" placeholder="Password" type={showPassword ? 'text' : 'password'}/>
                <button className="show-button" onClick={toggleShowPassword}>{showPassword ? 'Hide' : 'Show'} </button>
              </div>
              <button className="button"> Login </button>
              <button className="button"> Sign Up </button>
            </>
          )
        }
        function App(){
                   
          return (
            <>
              <p className = "title">Hello, welcome to my website</p>
              <LoginForm />
            </>
          );
        }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App/>);
    </script>
  </body>
</html>
