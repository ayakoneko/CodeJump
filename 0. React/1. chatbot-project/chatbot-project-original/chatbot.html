<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      body{
        font-family: Arial, Helvetica, sans-serif;
        margin: 0 auto;
      }
      .app-container{
        max-width: 600px;
        margin: 0 auto;
        height: 100vh;
        display: flex;
        flex-direction: column;

      }
      .chat-input-container{
        display: flex;
        margin-bottom: 60px;
      }
      .send-button{
        background-color: rgb(25, 135, 84);
        color: white;
        margin-left: 10px;
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
      }
      .chat-input{
        padding: 12px 15px;
        border-radius: 10px;
        border-width: 1px;
        font-size: 15px;
        flex-grow: 1;
      }
    
      .welcome-message{
        color: rgb(120, 120, 120);
        text-align: center;
      }
      .loading-spinner{
        height: 40px;
        margin: -15px;
      }
      .chat-message-container{
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
      }
      .chat-message-user{
        display: flex;
        justify-content: flex-end;
        align-items: flex-start;
      }
      .chat-message-robot{
        display: flex;
        align-items: flex-start;
      }
      .chat-message-text{
        background-color: rgb(238, 238, 238);
        padding: 15px 20px;
        border-radius: 10px;
        margin: 0 10px 20px;
        max-width: 300px;
      }
      .chat-message-profile{
        width: 45px;
      }


    </style>
  </head>

  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
    
      function ChatInput({chatMessages, setChatMessages}) {
        const [inputText, setInputText] = React.useState('');
        const [isLoading, setLoading] = React.useState(false);
        
        function saveInputText(event) {
          setInputText(event.target.value); 
        }

        async function sendMessage() {
          if (isLoading || inputText === ''){
            return
          }

          setLoading(true);

          const newChatMessages = [
            ...chatMessages,
            {
              message: inputText,
              sender: 'user',
              id: crypto.randomUUID()
            }
          ];
          
          setChatMessages([
            ...newChatMessages,
            {
              message: <img src="img/loading-spinner.gif" className="loading-spinner" />,
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ]);
          setInputText('');

          const response = await Chatbot.getResponseAsync(inputText);
          
          setChatMessages([
            ...newChatMessages,
            {
              message: response,
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ]);

          setLoading(false);
        }

        function handleKeyDown(event){
          if (event.key === 'Enter'){
            sendMessage();
          }else if (event.key === 'Escape'){
            setInputText('');
          }
          
        }

        return (
          <div className="chat-input-container">
            <input 
              placeholder="Send a message to Chatbot" size="30"
              onChange={saveInputText}
              onKeyDown={handleKeyDown}
              value={inputText}
              className = "chat-input"
            />
            <button onClick={sendMessage} className="send-button">
              Send
            </button>
          </div>
        );
      }

      function ChatMessage({message, sender}) {
        return (
          <div className={sender === 'user'?
                'chat-message-user':'chat-message-robot'}>
            
            {sender === 'robot' && <img src="img/robot.png" className="chat-message-profile"/>}
            
            <div className="chat-message-text">
              {message}
            </div>            
            
            {sender === 'user' && <img src="img/user.png" className="chat-message-profile"/>}
          </div>
        );
      }

      function useAutoScroll(dependencies){
        const containerRef = React.useRef(null);
        React.useEffect(() => {
          const containerElem = containerRef.current;
          if(containerElem){
            containerElem.scrollTop = containerElem.scrollHeight;
          }   
        }, dependencies);

        return containerRef;
      }

      function ChatMessages({chatMessages}) {  
        const chatMessagesRef = useAutoScroll([chatMessages]);

        return (
          <div className ="chat-message-container" ref={chatMessagesRef}>
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage 
                  message = {chatMessage.message}
                  sender = {chatMessage.sender}
                  key = {chatMessage.id}
                />
              )
            })}
          </div>
        );
      }

      function App() {
        const [chatMessages, setChatMessages] = React.useState([]);

        return (
          <div className="app-container">
            {chatMessages.length === 0 && (
              <p className="welcome-message"> Welcome to the chatbot project! Send a message using the textbox below.</p>
            )}
            <ChatMessages
              chatMessages = {chatMessages}
            />
            <ChatInput
              chatMessages = {chatMessages}
              setChatMessages = {setChatMessages} 
            />
          </div>
        );
      }
      
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App/>);

    </script>
  </body>
</html>
