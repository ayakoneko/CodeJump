<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeJump HTML/CSS Projects</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen text-slate-100
  bg-[radial-gradient(60%_80%_at_70%_40%,rgba(0,255,120,.25),transparent_60%),linear-gradient(135deg,#07140c,#050b08)]">

  <header class="min-h-[88vh] flex items-center px-5 pt-20 pb-10">
    <div class="mx-auto w-full max-w-5xl">
      <h1 class="text-[clamp(42px,6vw,76px)] font-extrabold leading-[1.05] tracking-[-0.5px]">
        BUILDING <br />
        <span class="text-[#3cff7a]">DIGITAL</span> <br />
        EXPERIENCES
      </h1>

      <p class="mt-4 max-w-xl text-base leading-relaxed text-slate-100/80">
        I create usable and functional interfaces for the modern web.
        Specializing in HTML, CSS, JavaScript, and UI layout practice.
      </p>

      <div class="mt-7">
        <input id="search" type="search" placeholder="Search projects..."
          class="w-full max-w-[520px] rounded-full border border-white/15 bg-black/35
          px-5 py-4 text-[15px] text-slate-100 placeholder:text-slate-100/60
          outline-none focus:border-[#3cff7a] focus:ring-4 focus:ring-[#3cff7a]/15" />
      </div>
    </div>
  </header>

  <main class="mx-auto w-full max-w-5xl px-5 pb-16">
    <h2 class="text-2xl font-bold tracking-[-0.2px] text-slate-50">HTML/CSS Projects</h2>

    <!-- add grid classes here since you removed hub.css -->
    <section id="grid"
      class="mt-5 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3"
      aria-label="Project list"></section>
  </main>

  <script src="./hub.js"></script>
</body>
</html>
