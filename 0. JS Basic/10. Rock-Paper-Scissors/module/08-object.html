<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <p>
        <button onclick="playGame('rock');">Rock</button>
        <button onclick="playGame('paper');">Paper</button>
        <button onclick="playGame('scissors');">Scissors</button>
        <button onclick="
                score.wins = 0;
                score.losses = 0;
                score.ties = 0;
                localStorage.removeItem('score');
            ">Reset Score</button>
    </p>    

    <script>
        let score = JSON.parse(localStorage.getItem('score')) || { wins: 0, losses: 0, ties: 0,};    

        function playGame(playerMove){

            const computerMove = pickComputerMove();
            let result = '';

            if (playerMove === 'rock'){
                if (computerMove === 'rock'){
                    result='Tie.';
                }else if (computerMove === 'paper'){
                    result='You Lose.';
                }else if (computerMove === 'scissors'){
                    result='You Win.';
                }
            } else if (playerMove === 'paper'){
                if (computerMove === 'rock'){
                    result='You Win.';
                }else if (computerMove === 'paper'){
                    result='Tie.';
                }else if (computerMove === 'scissors'){
                    result='You Lose.';
                }
            }  else if (playerMove === 'scissors'){
                if (computerMove === 'rock'){
                    result='You Lose.';
                }else if (computerMove === 'paper'){
                    result='You Win.';
                }else if (computerMove === 'scissors'){
                    result='Tie.';
                }
            }

            if (result === 'You Win.'){
                score.wins ++;
            }else if (result === 'You Lose.'){
                score.losses ++;
            }else if (result === 'Tie.'){
                score.ties ++;
            }

            localStorage.setItem('score', JSON.stringify(score));
                
            alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result} \n Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`)
        }

        let computerMove = '';
        function pickComputerMove(){

            const randomNumer = Math.random();

            if (randomNumer >=0 && randomNumer < 1/3 ){
                computerMove = 'rock';
            }else if (randomNumer >=1/3 && randomNumer < 2/3 ){
                computerMove = 'paper';
            }else if (randomNumer >=2/3 && randomNumer < 1 ){
                computerMove = 'scissors';
            }

            return computerMove
        }
    </script>
</body>
</html>
