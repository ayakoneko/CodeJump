<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <style>
        body{font-family: Arial, Helvetica, sans-serif;}
        .todo-input-grid, .todo-grid{
            display: grid;
            grid-template-columns: 200px 150px 100px;
            align-items: center;
            gap: 10px;}
        .todo-input-grid{
            margin-bottom: 10px;
            align-items: stretch;}
        .name-input, .date-input{
            font-size: 15px;
            padding: 6px;}
        .add-button{
            background-color: green;
            color: white;
            border: none;
            font-size: 15px;
            cursor: pointer;}
        .delete-button{
            background-color: darkred;
            color: white;
            border: none;
            font-size: 15px;
            padding: 10px;
            cursor: pointer;}
    </style>

</head>
<body>
    <p>Todo List</p>
    <div class="todo-input-grid">
        <input class="js-name-input name-input" placeholder="Todo name" onkeydown="handleEnterKey(event);">
        <input class="js-date-input date-input" type="date">
        <button class="add-button" onclick="addTodo();">Add</button>

    </div>

    <div class="js-todo-list todo-grid"></div>
    

    <script>
        const todoList = JSON.parse(localStorage.getItem('todoList')) || [];

        // function renderTodoList(){
        //     let todoListHTML = '';

        //     for (let i=0; i < todoList.length; i++){
        //         const { name, dueDate } = todoList[i];

        //         const html = `
        //                 <div>${name}</div>
        //                 <div>${dueDate}</div>
        //                 <button class="delete-button"  
        //                     onclick = 
        //                         "todoList.splice(${i}, 1); 
        //                         renderTodoList();
        //                         saveToStorage();                        
        //                 ">Delete</button> 
        //             `;

        //         todoListHTML += html;
        //     }

        //     document.querySelector('.js-todo-list').innerHTML = todoListHTML;
        // }

        function renderTodoList(){
            let todoListHTML = '';

            todoList.forEach((todoObject, index) => {
                const { name, dueDate } = todoObject;

                const html = `
                        <div>${name}</div>
                        <div>${dueDate}</div>
                        <button class="delete-button js-delete-button">Delete</button> 
                    `;

                todoListHTML += html;
            });

            document.querySelector('.js-todo-list').innerHTML = todoListHTML;

            document.querySelectorAll('.js-delete-button').forEach((deleteButton, index) => {
                deleteButton.addEventListener('click', () => {
                    todoList.splice(index, 1); 
                    renderTodoList();
                    saveToStorage(); 
                });
            });

        }


        function handleEnterKey(event){
            if (event.key === 'Enter'){
                addTodo();
            }
        }


        function addTodo() {
            const inputElement = document.querySelector('.js-name-input');
            const dateElement = document.querySelector('.js-date-input');
            const name = inputElement.value;
            const dueDate = dateElement.value;
            todoList.push({ name, dueDate});

            inputElement.value='';            
            renderTodoList();
            saveToStorage();
        }


        function saveToStorage(){
            localStorage.setItem('todoList', JSON.stringify(todoList));
        }
         
    </script>
</body>
</html>
